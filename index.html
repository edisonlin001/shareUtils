<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源分享</title>
    <meta name="description" content="优质资源分享">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4eaf5 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }

        .ad-container {
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 22px 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .welcome-card {
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(20px);
            background: rgba(255,255,255,0.9);
            border-radius: 28px;
            padding: 60px 35px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 20px;
        }

        .welcome-desc {
            font-size: 17px;
            color: #86868b;
            line-height: 1.6;
        }

        .apple-card {
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: none;
        }

        .resource-title {
            font-size: 26px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 16px;
        }

        .resource-desc {
            font-size: 16px;
            color: #86868b;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .apple-btn {
            display: none;
            width: 100%;
            padding: 18px 0;
            color: #fff;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-quark {
            background: #25C673;
            box-shadow: 0 4px 15px rgba(37, 198, 115, 0.3);
        }

        .btn-baidu {
            background: #1677ff;
            box-shadow: 0 4px 15px rgba(22, 119, 255, 0.3);
        }

        footer {
            font-size: 13px;
            color: #86868b;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="ad-container">顶部广告位 · 粘贴你的广告代码</div>

    <div class="welcome-card" id="welcome">
        <h1 class="welcome-title">👋 欢迎光临</h1>
        <p class="welcome-desc">这里有很多没费资源分享<br>请通过专属链接获取资源</p>
    </div>

    <div class="apple-card" id="resourceCard">
        <h2 class="resource-title" id="title">加载中...</h2>
        <p class="resource-desc" id="desc"></p>
        <div class="btn-group">
            <a id="quarkBtn" class="apple-btn btn-quark" target="_blank">🟢 夸克网盘获取</a>
            <a id="baiduBtn" class="apple-btn btn-baidu" target="_blank">🔵 百度网盘获取</a>
        </div>
    </div>

    <div class="ad-container">底部广告位 · 粘贴你的广告代码</div>

    <footer>© 2025 资源分享 · 仅供学习交流</footer>

    <script>
        (async () => {
            const params = new URLSearchParams(location.search);
            const pageId = params.get('p');

            // 无参数 → 显示欢迎页
            if (!pageId) {
                showWelcome();
                return;
            }

            try {
                // 请求后端资源
                const response = await fetch(`/api/get?p=${pageId}`);
                const res = await response.json();

                // ======================
                // 关键：如果返回无效资源，直接跳回首页
                // ======================
                if (!res || res.valid === false) {
                    location.replace('/'); // 跳回首页，不留历史记录
                    return;
                }

                // 显示资源
                showResource();
                document.getElementById('title').innerText = '📁 ' + res.title;
                document.getElementById('desc').innerText = res.desc;

                // 夸克链接不为空才显示
                const quarkBtn = document.getElementById('quarkBtn');
                if (res.quark?.trim()) {
                    quarkBtn.href = res.quark;
                    quarkBtn.style.display = 'block';
                }

                // 百度链接不为空才显示
                const baiduBtn = document.getElementById('baiduBtn');
                if (res.baidu?.trim()) {
                    baiduBtn.href = res.baidu;
                    baiduBtn.style.display = 'block';
                }

            } catch (e) {
                // 报错也跳回首页
                location.replace('/');
            }
        })();

        function showWelcome() {
            document.getElementById('welcome').style.display = 'block';
            document.getElementById('resourceCard').style.display = 'none';
        }

        function showResource() {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('resourceCard').style.display = 'block';
        }
    </script>
</body>
</html>
