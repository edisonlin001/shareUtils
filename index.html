<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源分享</title>
    <meta name="description" content="优质资源分享">
    <meta name="monetag" content="e3ae99629ef59520acb5cd32857030dc">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4eaf5 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }

        /* 公众号二维码模块（居中、底部广告前） */
        .wechat-qrcode {
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .qrcode-img {
            width: 130px;
            height: 130px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #eee;
        }
        .qrcode-desc {
            font-size: 16px;
            color: #1d1d1f;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .qrcode-sub {
            font-size: 13px;
            color: #86868b;
        }

        .ad-container {
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 22px 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .welcome-card {
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(20px);
            background: rgba(255,255,255,0.9);
            border-radius: 28px;
            padding: 60px 35px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 20px;
        }

        .welcome-desc {
            font-size: 17px;
            color: #86868b;
            line-height: 1.6;
        }

        .apple-card {
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: none;
        }

        .resource-title {
            font-size: 26px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 16px;
        }

        .resource-desc {
            font-size: 16px;
            color: #86868b;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .apple-btn {
            display: none;
            width: 100%;
            padding: 18px 0;
            color: #fff;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-quark {
            background: #25C673;
            box-shadow: 0 4px 15px rgba(37, 198, 115, 0.3);
        }
        .btn-quark:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 198, 115, 0.4);
            background: #1fb667;
        }

        .btn-baidu {
            background: #1677ff;
            box-shadow: 0 4px 15px rgba(22, 119, 255, 0.3);
        }
        .btn-baidu:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(22, 119, 255, 0.4);
            background: #0066dd;
        }

        footer {
            font-size: 13px;
            color: #86868b;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- 提醒广告 -->
    <script>(function(s){s.dataset.zone='10994809',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
    <!-- 弹窗广告 -->
    <!-- <script>(function(s){s.dataset.zone='10994794',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script> -->
    <!-- 顶部广告 -->
    <!--<div class="ad-container">顶部广告位 · 粘贴你的广告代码</div> -->

    <!-- 欢迎/资源卡片 -->
    <div class="welcome-card" id="welcome">
        <h1 class="welcome-title">👋 欢迎光临</h1>
        <p class="welcome-desc">这里是优质资源分享主页<br>请通过专属链接获取资源</p>
    </div>

    <div class="apple-card" id="resourceCard">
        <h2 class="resource-title" id="title">加载中...</h2>
        <p class="resource-desc" id="desc"></p>
        <div class="btn-group">
            <a id="quarkBtn" class="apple-btn btn-quark" target="_blank">🟢 夸克网盘获取</a>
            <a id="baiduBtn" class="apple-btn btn-baidu" target="_blank">🔵 百度网盘获取</a>
        </div>
    </div>

    <!-- 【重点】二维码：放在底部广告前面，居中 -->
    <div class="wechat-qrcode">
        <img src="wechat-qrcode.jpg" alt="微信公众号二维码" class="qrcode-img">
        <div class="qrcode-desc">长按或扫码关注公众号</div>
        <div class="qrcode-sub">获取更多优质资源</div>
    </div>

    <!-- 底部广告（在二维码下方） -->
    <!-- <div class="ad-container">底部广告位 · 粘贴你的广告代码</div> -->

    <footer>© 2026 资源分享 · 仅供学习交流</footer>

    <script>
        (async () => {
            const params = new URLSearchParams(location.search);
            const pageId = params.get('p');

            if (!pageId) {
                showWelcome();
                return;
            }

            try {
                const response = await fetch(`/api/get?p=${pageId}`);
                const res = await response.json();

                if (!res || res.valid === false) {
                    location.replace('/');
                    return;
                }

                showResource();
                document.getElementById('title').innerText = '📁 ' + res.title;
                document.getElementById('desc').innerText = res.desc;

                const quarkBtn = document.getElementById('quarkBtn');
                if (res.quark?.trim()) {
                    quarkBtn.href = res.quark;
                    quarkBtn.style.display = 'block';
                }

                const baiduBtn = document.getElementById('baiduBtn');
                if (res.baidu?.trim()) {
                    baiduBtn.href = res.baidu;
                    baiduBtn.style.display = 'block';
                }

            } catch (e) {
                location.replace('/');
            }
        })();

        function showWelcome() {
            document.getElementById('welcome').style.display = 'block';
            document.getElementById('resourceCard').style.display = 'none';
        }

        function showResource() {
            document.getElementById('welcome').style.display = 'none';
            document.getElementById('resourceCard').style.display = 'block';
        }
    </script>
</body>
</html>
